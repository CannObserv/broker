# broker#21. This node's cgroup2 is mounted WITHOUT memory_recursiveprot, so a
# service's MemoryLow= is capped by its slice's - and system.slice defaults to
# 0. Without this, redis-server's and tailscaled's drop-ins read correctly in
# `systemctl show` and protect nothing. At least their sum.
[Slice]
MemoryLow=1280M
