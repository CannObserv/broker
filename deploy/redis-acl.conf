# Per-service Redis ACL users for the change-bus broker (CannObserv/broker#1 D3,
# CannObserv/broker#2).
#
# INSTALL: /etc/redis/users.acl, 0640 root:redis, with each __*_PW__ placeholder
# replaced from /etc/redis/broker-acl-passwords. Enabled by `aclfile
# /etc/redis/users.acl` in redis.conf.
#
# `aclfile` is an IMMUTABLE config - `CONFIG SET aclfile` fails - so turning it
# on costs one restart, which on this instance is a cohort-wide event (#5).
# Everything after that is live: `ACL SETUSER` applies immediately and `ACL SAVE`
# persists here, no restart. That is the whole reason for preferring a separate
# file over `user` lines in redis.conf: an ACL that can only be changed by a
# cohort-wide restart is an ACL nobody will dare tighten.
#
# ONE USER PER LINE. Neither redis.conf nor an aclfile supports backslash
# continuation, so the drafted-with-continuations version in the issue thread
# would not have parsed. tests/deploy/test_redis_acl.py loads this file into a
# throwaway redis-server, which is what turns that from a cutover-window
# discovery into a test failure.
#
# THE COMMAND LISTS ARE OBSERVED, NOT GUESSED. Two `MONITOR` captures on the
# live broker, plus the dead-letter routes exercised under `MONITOR` by
# CannObserv/watcher#288 and CannObserv/replicator#79 - the one path neither
# original capture covered, and the only command in the inventory that had been
# read off the source rather than seen on the wire.
#
# WHY THIS IS SAFE TO GET WRONG, ONCE. All three participants classify NOPERM as
# transient (archiver#193 Phase 1, replicator#82, and watcher's loops classify by
# nothing so they back off by default), so a missing grant degrades to a
# backing-off publisher an operator can fix with one `ACL SETUSER`. It does NOT
# dead-letter valid events. That property was bought deliberately before this
# file was allowed to exist, and it is what makes the cutover survivable - do not
# ship an ACL change to a participant that has lost it.
#
# AUTH, HELLO and RESET are always permitted regardless of the command list, so
# they are deliberately not enumerated. Everything not granted is denied.
#
# +config|get is the SECOND silent-blinding grant, found from `ACL LOG` minutes
# after the cutover: archiver was denied it once, at service start. Every
# participant's scripts/check_redis_floor.sh reads `redis_version` via
# `INFO server` AND `maxmemory` via `CONFIG GET` - and its own documented
# behaviour for an unreadable maxmemory is "don't cry wolf, stay quiet about it,
# exit 0". So the denial costs the warn-only check half its job and says nothing.
# Exactly the shape +info was added for, in a second place. Read-only, so the
# grant is narrow.
#
# NO +client|setinfo, and the reason is a version floor rather than a decision.
# broker#2 recommended granting it pre-emptively - redis-py has sent it since v5,
# and the two MONITOR captures only proved it absent on redis-py 7.4.1 over
# RESP2, which is a client-version property and not a contract. But CLIENT
# SETINFO does not exist until **Redis 7.2**, and this broker is 7.0.15: the
# grant is rejected outright and takes the whole file with it ("Unknown command
# or category name in ACL" - redis refuses every user, not the offending rule).
# So it cannot be bought cheaply here. It becomes a REQUIRED step of any upgrade
# to >= 7.2, alongside re-checking the handshake under MONITOR, and
# tests/deploy/test_redis_acl.py::test_redis_loads_the_file is what will catch it
# being added too early.

# --- archiver -----------------------------------------------------------------
# Note what is ABSENT: ~content.blobs. That single omission is what turns the
# unqualified role boundary from a sentence in a file into something the broker
# refuses. It is the reason this whole file is preferred over a shared password.
#
# ~info.changes.dlq is absent too: archiver produces info.changes and never
# consumes it, so it has no dead-letter path there. Under Phase 5 that queue's
# drainer is replicator, prospectively (archiver#155 may retire the stream).
user archiver on >__ARCHIVER_PW__ resetchannels ~info.changes ~info.registry ~info.watch-status ~content.revisions ~content.revisions.dlq ~content.artifacts ~content.artifacts.dlq ~content.replicate +xadd +xtrim +xread +xreadgroup +xack +xautoclaim +xgroup|create +xlen +xrange +xpending +xinfo|stream +exists +info +ping +config|get

# --- watcher ------------------------------------------------------------------
# ~content.blobs.dlq covers a path with NO CALLER TODAY: watcher's blobs loop
# acks past an undecodable frame rather than quarantining it (watcher#288). The
# grant stays because a path that acquires a caller under an ACL that forbids it
# fails at the worst possible moment.
#
# No +xinfo and no +xgroup|destroy: watcher#286 deleted the legacy-group
# migration that needed them. Sequencing, not a grant.
user watcher on >__WATCHER_PW__ resetchannels ~content.fetch ~content.fetch-policy ~content.revisions ~content.blobs ~content.blobs.dlq ~info.watch-status ~info.registry +xadd +xread +xreadgroup +xack +xautoclaim +xgroup|create +xlen +xrange +xtrim +xinfo|stream +info +ping +config|get

# --- replicator ---------------------------------------------------------------
# +xrange is load-bearing and was missing from the draft. The anomaly
# dead-letter route - a frame that never decoded, so there is no field map to
# copy - re-reads the entry with XRANGE <topic> <id> <id> before writing the DLQ
# copy (replicator#79). A grant covering the write but not the re-read jams
# exactly the poison frames the DLQ exists to quarantine, which is the
# content.fetch.dlq failure mode that reached 110 entries in archiver#162.
#
# ~replicator:cmd:fetch:* is not a stream: replicator uses the broker as expiring
# state via SET .. NX EX (replicator#80 asks what they guard).
user replicator on >__REPLICATOR_PW__ resetchannels ~content.fetch ~content.fetch.dlq ~content.fetch-policy ~content.blobs ~content.replicate ~content.replicate.dlq ~content.artifacts ~replicator:cmd:fetch:* +xadd +xread +xreadgroup +xack +xautoclaim +xgroup|create +xlen +xrange +xtrim +xinfo|stream +set +info +ping +config|get

# --- brokeradmin --------------------------------------------------------------
# The bus-health probe and the backstop DLQ drainer. Instance-wide by nature:
# INFO memory has no key, and the DLQ sweep is `SCAN MATCH *.dlq` precisely so it
# finds queues nobody declared.
#
# Narrowed from the draft's `~* &* +@all`. It reads everything and trims DLQs; it
# has no reason to XADD, and none to touch ACL, CONFIG SET, FLUSHDB or
# replication. +config|get is for tests/deploy/test_live_broker_matches_tracked_config.py.
#
# "Reachable over loopback only" is NOT enforceable - Redis has no per-user
# source restriction. What protects this user is that its password never leaves
# the node. Say it that way round, so nobody later relies on a constraint that
# does not exist.
#
# +client|list and +acl|log are the NODE'S DIAGNOSTICS, and they are here because
# `user default off` would otherwise take them away from everybody. No service
# user holds them and none should. Both earned their place during the cutover:
# `ACL LOG` found archiver's `config|get` denial in one command, where the
# alternative was reading three services' journals on two hosts this node
# deliberately cannot reach; and `CLIENT LIST`'s `flags=b` is the only reliable
# way to tell a blocked consumer from a client that merely ran a read once -
# `XINFO CONSUMERS` idle does NOT update on an empty read, and consumers=0 on a
# stream that has never carried a message means nothing at all.
#
# `+acl|log` also permits `ACL LOG RESET`; Redis has no finer granularity, and
# being able to read the log is worth more than being unable to clear it.
user brokeradmin on >__BROKERADMIN_PW__ resetchannels ~* +info +ping +scan +exists +xlen +xrange +xinfo +xpending +xtrim +config|get +client|list +acl|log

# --- citest -------------------------------------------------------------------
# R4's answer on the topic-name axis. Redis ACLs cannot partition by database
# index at all, so the db15 guard was never the enforcement - a credential that
# cannot NAME a production topic is. The database-index axis is closed
# separately by `databases 1` (#5); neither substitutes for the other.
user citest on >__CITEST_PW__ resetchannels ~probe.* ~replicator.itest.* +@all -@admin -@dangerous

# --- default ------------------------------------------------------------------
# STAYS ENABLED AT FIRST LOAD, AND THIS LINE MUST NEVER BE DELETED.
#
# Two things are true at once here and both of them bite.
#
# 1. **Omitting `default` from an aclfile silently makes it `nopass`.** Verified
#    on a scratch instance: with `requirepass` set in redis.conf and an aclfile
#    that does not mention `default`, an ANONYMOUS client gets `PONG` - while
#    `CONFIG GET requirepass` still returns the password, so every check anyone
#    would think to run still says auth is on. The ACL subsystem owns `default`
#    once an aclfile exists, and it defaults to `nopass ~* &* +@all`. That is R2
#    exactly - a tailnet-bound broker reachable by every node the policy admits,
#    including a user-owned one - arriving as a side effect of turning on the
#    mechanism that was supposed to tighten it.
#
# 2. **`user default off` at first load locks out all three services**, because
#    the restart that enables `aclfile` happens BEFORE any service has been moved
#    onto its own credential. Every URL still says `default:` at that moment.
#
# So the line below deliberately restates today's behaviour, and __DEFAULT_PW__
# is the CURRENT `requirepass` value from /etc/redis/broker-password - nothing
# changes for anyone at the restart.
#
# Retiring the shared password is then a LIVE step at the end of the cutover,
# after every service and the probe are confirmed on their own credential:
#
#     redis-cli -u "$BROKERADMIN_URL" ACL SETUSER default off
#     redis-cli -u "$BROKERADMIN_URL" ACL SAVE
#
# (`brokeradmin` has no +acl, so run those as `default` - it is the last thing
# that user does.) Reversing it is `ACL SETUSER default on >...` plus `ACL SAVE`,
# which is why this is the safe place to put the irreversible-feeling step: it is
# live, rolling, and needs no window.
user default on >__DEFAULT_PW__ ~* &* +@all
