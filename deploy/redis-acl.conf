# Per-service Redis ACL users for the change-bus broker (CannObserv/broker#1 D3,
# CannObserv/broker#2).
#
# INSTALL: /etc/redis/users.acl, 0640 root:redis, rendered by render-acl.sh with
# each `>__*_PW__` replaced by `#<sha256>` from /etc/redis/broker-acl-passwords -
# which holds a user as its plaintext or, when this node needs none, as the digest
# alone (CannObserv/broker#49). Enabled by `aclfile /etc/redis/users.acl` in
# redis.conf.
#
# `aclfile` is an IMMUTABLE config - `CONFIG SET aclfile` fails - so turning it
# on costs one restart, which on this instance is a cohort-wide event (#5).
# Everything after that is live: `ACL SETUSER` applies immediately and `ACL SAVE`
# persists here, no restart. That is the whole reason for preferring a separate
# file over `user` lines in redis.conf: an ACL that can only be changed by a
# cohort-wide restart is an ACL nobody will dare tighten.
#
# ONE USER PER LINE. Neither redis.conf nor an aclfile supports backslash
# continuation, so the drafted-with-continuations version in the issue thread
# would not have parsed. tests/deploy/test_redis_acl.py loads this file into a
# throwaway redis-server, which is what turns that from a cutover-window
# discovery into a test failure.
#
# THE COMMAND LISTS ARE OBSERVED, NOT GUESSED. Two `MONITOR` captures on the
# live broker, plus the dead-letter routes exercised under `MONITOR` by
# CannObserv/watcher#288 and CannObserv/replicator#79 - the one path neither
# original capture covered, and the only command in the inventory that had been
# read off the source rather than seen on the wire. One grant came from neither:
# replicator's +xpending (broker#39), read off an `ACL LOG` denial and the
# caller's source, on a path no capture ran - not yet seen succeeding on the
# node.
#
# WHY THIS IS SAFE TO GET WRONG, ONCE. All three participants classify NOPERM as
# transient (archiver#193 Phase 1, replicator#82, and watcher's loops classify by
# nothing so they back off by default), so a missing grant degrades to a
# backing-off publisher an operator can fix with one `ACL SETUSER`. It does NOT
# dead-letter valid events. That property was bought deliberately before this
# file was allowed to exist, and it is what makes the cutover survivable - do not
# ship an ACL change to a participant that has lost it.
#
# AUTH, HELLO and RESET are always permitted regardless of the command list, so
# they are deliberately not enumerated. Everything not granted is denied.
#
# +config|get is the SECOND silent-blinding grant, found from `ACL LOG` minutes
# after the cutover: archiver was denied it once, at service start. Archiver's
# scripts/check_redis_floor.sh reads `redis_version` via `INFO server` AND
# `maxmemory` via `CONFIG GET` - and its own documented behaviour for an
# unreadable maxmemory is "don't cry wolf, stay quiet about it, exit 0". So the
# denial cost the warn-only check half its job and said nothing. It was granted
# to all three services; only archiver has ever issued it. Watcher has no floor
# script and replicator's reads `INFO server` alone.
#
# READ-ONLY IS NOT NARROW, and that is why it came off (CannObserv/broker#50).
# `CONFIG GET requirepass` returns the `default` user's break-glass password -
# the running value, which a restart makes the current one - and Redis 7.0
# refuses `+config|get|maxmemory` ("Allowing first-arg of a subcommand is not
# supported"), so there is no grant that reads the cap without the credential.
# None is needed: `INFO memory` carries `maxmemory` and `maxmemory_policy`, and
# every service holds `+info`. Watcher and replicator lost it live 2026-09-23;
# archiver the same day, once its floor check read `INFO memory` instead
# (CannObserv/archiver#257) - in that order, or the check goes quietly blind.
#
# NO +client|setinfo, and the reason is a version floor rather than a decision.
# broker#2 recommended granting it pre-emptively - redis-py has sent it since v5,
# and the two MONITOR captures only proved it absent on redis-py 7.4.1 over
# RESP2, which is a client-version property and not a contract. But CLIENT
# SETINFO does not exist until **Redis 7.2**, and this broker is 7.0.15: the
# grant is rejected outright and takes the whole file with it ("Unknown command
# or category name in ACL" - redis refuses every user, not the offending rule).
# So it cannot be bought cheaply here. It becomes a REQUIRED step of any upgrade
# to >= 7.2, alongside re-checking the handshake under MONITOR, and
# tests/deploy/test_redis_acl.py::test_redis_loads_the_file is what will catch it
# being added too early.

# EVERY COMMAND THAT CHANGES A STREAM'S ENTRIES OR A KEY'S VALUE IS
# SELECTOR-SCOPED, AND A SELECTOR IS THE ONLY GRAMMAR THAT CAN DO IT. That is
# XADD, XTRIM, XDEL and SET - narrower than "every command that writes", which
# this heading used to say (broker#39). The `(+xadd ~...)`, `(+xtrim ~...)`,
# `(+xdel ~...)` and `(+set ~...)` groups below - `(+xadd +xtrim ~...)` where
# one pattern list serves both - are Redis 7 **selectors**: an extra permission
# set carrying its own command list and its own key patterns, where a command is
# allowed if the root permissions allow it OR any selector does. The root
# permission set never learns any of them, and that is the whole point - a root
# key pattern applies to EVERY command the user holds, so a root `+xdel` beside
# `~content.replicate` is XDEL on a command stream, deleting commands the group
# has not delivered and orphaning the PEL entries naming them. That is the exact
# hazard ../docs/STREAMS.md carves that stream out of the trim set for.
#
# `+xadd` AND `+xtrim` MOVED THE SAME WAY, AND THEY WERE THE WIDER HOLE
# (broker#14). A service that must *read* one stream and *write* another held
# both commands against both patterns, so **every stream but `info.changes` had
# exactly one unintended writer, and it was always the consumer** - every
# consumer on this bus could forge its own work. Each service now carries a
# publish selector naming only what ../docs/STREAMS.md says it produces, plus
# the dead-letter queues it writes. What falls out for free is the sharpest
# case: `content.replicate` is in no `+xtrim` selector anywhere, so "never
# XTRIMmed" stops being a convention in archiver's source and becomes something
# the broker refuses - to archiver, which could trim it, and to replicator,
# whose PEL entries would have been the ones orphaned. broker#34 added the second
# such stream, info.registry, once archiver confirmed nothing of its own trims it
# (CannObserv/archiver#234); its cap rides each XADD instead.
#
# WHY THE GRANT WAS OWED. broker#1 Phase 5 split the drain into two jobs:
# detecting a non-resting queue, preserving its entries and naming an addressee
# is the broker's, and reading the payloads to tell residue from a real
# permanent failure - plus the deletion that follows - belongs to the stream's
# own consumer, per `DLQ_DRAINERS` in ../src/broker/bus_health.py. The comment
# above that table claimed the assignment "costs nothing under D3 - each service
# already holds `~<its own topic>.dlq`". **The key pattern was granted and the
# deletion command was not**, so every named drainer could fill its queue and
# not empty it. broker#12 found it the way such things are found: a frame parked
# in content.replicate.dlq and the service that put it there could not remove it.
# It was true of five queues across three services, not just the one.
#
# WHAT EACH SELECTOR CANNOT REACH, and this is what makes the grant safe rather
# than merely narrow: the stream its queue is a copy OF. A dead-letter entry
# duplicates a fact that also went to content.blobs or content.artifacts, which
# is what issuers actually read, so deleting one destroys no unique record -
# and that argument collapses the moment a deletion grant can reach the
# original. `test_no_xdel_grant_can_name_a_fact_or_command_stream` derives that
# denial from co-core's stream set rather than reading it off these lines, and
# `test_a_drainer_can_empty_its_own_queue_and_not_the_stream_it_copies` makes
# redis prove it.
#
# NOT GRANTED: info.changes.dlq, whose prospective drainer is replicator.
# Replicator holds no ~info.changes pattern at all, so it cannot consume the
# stream let alone triage the queue, and deletion ahead of the group would be
# deletion without the ability to read what is being deleted. The day that group
# arrives the pattern arrives with it, and the derived test starts demanding this
# grant on its own.
#
# WHAT STAYS ON THE ROOT STILL WRITES, AND IS NOT CONFINED. XREADGROUP, XACK,
# XAUTOCLAIM and XGROUP CREATE are `write` commands on 7.0.15, and every service
# holds all four on its root. They change a group's position, its PEL and its
# consumers, never an entry (XGROUP CREATE ... MKSTREAM makes an empty stream,
# which holds none). That is an OPEN HOLE, not a decision: each grouped
# stream's producer names it on the root, so it can take delivery in its
# consumer's group and XACK the entry away before the consumer sees it. That is
# broker#14's hole the other way round, tested against this file (broker#43).
# `citest` holds `+@all` on its root, on scratch patterns that name no
# production key, and `default` is off.

# DENIALS THAT ARE NOT FAULTS (broker#48). `ACL LOG` is the evidence an operator
# reads for an ACL fault, and it holds two kinds of entry that are not faults.
# A denial that PRODUCED a grant is explained in this file's grant provenance:
# the user's stanza (replicator's +xpending) or this header (+config|get,
# above). A denial that produced no grant and never will is
# explained here. Most of these come from somebody checking something: a peer
# agent's verification probe, an agent's ad-hoc read, a runbook run against a
# stale credential. An entry named in neither place is the thing to chase.
#
# NEVER `ACL LOG RESET`. It wipes real evidence along with the noise, and Redis
# has no finer granularity. A benign entry therefore stays until a restart
# clears the log or 128 newer entries push it out (`acllog-max-len`), and
# nobody can remove it selectively. The only remedy is a row here, in the same
# session that caused the entry.
#
# A PEER'S DENIALS ARE BACKFILLED AFTER, NOT ANNOUNCED BEFORE. A peer's
# verification reads land in this node's log, which the peer cannot read, so it
# rarely knows it caused one. On 2026-09-24 archiver's agent did not. This
# node's owner reads the log and names each timestamp. 7.0.15 has no
# `timestamp-created`, so compute each one as server time minus `age-seconds`,
# never by eye. The peer then attributes each entry from its own session logs,
# and the row lands here. tests/deploy/test_redis_acl.py fails a row that
# stops describing a denial, i.e. once a grant would admit it.
#
#  user         reason  object                 command       utc                   who: why
#   archiver     command acl|whoami             acl|whoami    2026-09-22T19:52:09Z  archiver-agent: ACL WHOAMI while diagnosing CannObserv/archiver#247
#   brokeradmin  command xrevrange              xrevrange     2026-09-22T14:00:24Z  broker-agent: ad-hoc sizing read; +xrange is granted, +xrevrange is not
#   brokeradmin  command xrevrange              xrevrange     2026-09-22T16:51:22Z  broker-agent: the same read again, because nothing recorded the first
#   archiver     key     info.registry          xtrim         2026-09-23T00:12:48Z  archiver-agent: no-op XTRIM MAXLEN ~ 999999999 verifying broker#34; NOPERM was the pass
#   archiver     auth    AUTH                   -             2026-09-23T04:47:59Z  broker-agent: ACL-CUTOVER.md's PING loop against the digest-only archiver credential (broker#47)
#   archiver     command acl|whoami             acl|whoami    2026-09-24T03:59:28Z  archiver-agent: read-only script in a session before CannObserv/archiver#231
#   archiver     key     content.fetch          xlen          2026-09-24T12:44:51Z  archiver-agent: XLEN sweep over every stream for CannObserv/archiver#231
#   archiver     key     content.fetch-policy   xlen          2026-09-24T12:44:51Z  archiver-agent: XLEN sweep over every stream for CannObserv/archiver#231
#   archiver     key     content.blobs          xlen          2026-09-24T12:44:51Z  archiver-agent: XLEN sweep over every stream for CannObserv/archiver#231
#   archiver     key     content.fetch.dlq      xlen          2026-09-24T12:44:51Z  archiver-agent: XLEN sweep over every stream for CannObserv/archiver#231
#   archiver     key     content.replicate.dlq  xlen          2026-09-24T12:44:51Z  archiver-agent: XLEN sweep over every stream for CannObserv/archiver#231
#   archiver     command memory|usage           memory|usage  2026-09-24T13:23:28Z  archiver-agent: MEMORY USAGE inside an XINFO STREAM script, CannObserv/archiver#231 Q1

# --- archiver -----------------------------------------------------------------
# Note what is ABSENT: ~content.blobs. That single omission is what turns the
# unqualified role boundary from a sentence in a file into something the broker
# refuses. It is the reason this whole file is preferred over a shared password.
#
# ~info.changes.dlq is absent too: archiver produces info.changes and never
# consumes it, so it has no dead-letter path there. Under Phase 5 that queue's
# drainer is replicator, prospectively (archiver#155 may retire the stream).
#
# WHAT ARCHIVER MAY TRIM IS WHAT IT TRIMS: info.changes (CannObserv/archiver#234,
# answered 2026-09-18 at every call site rather than recalled). One XTRIM in the
# process, from its outbox drain loop, which trims exactly `trim_topics` - an
# allowlist since CannObserv/archiver#239, passed as
# frozenset({outbox_publisher.CHANGE_STREAM_TOPIC}) in archiver's
# src/api/main.py and held to frozenset({"info.changes"}) by its pins. That
# set and this selector are one decision: widen one and you widen the other.
# Each repo pins its half -
# tests/deploy/test_redis_acl.py::test_archiver_trim_grant_is_its_trim_allowlist
# here, test_trim_allowlist_is_info_changes_only and
# test_run_trim_allowlist_defaults_to_info_changes_only in archiver (broker#55).
# Each cites the other's test by name (CannObserv/archiver#262): renaming
# either side's pin breaks the other's citation, and no test notices - neither
# suite runs the other's.
# co-core and co-core-aio issue no XTRIM, and nothing in the three
# issues XDEL until archiver's dead-letter triage deploys (below). So
# ~info.registry came out of the `+xtrim` selector in
# broker#34, which split rather than shrank because archiver still publishes
# the registry. Its cap never needed the grant - `BusPublish.maxlen`
# puts MAXLEN on the XADD, and an ACL checks the command, not its arguments.
# That is also the limit: an ACL cannot bound a MAXLEN, so the registry's floor
# on the publish path is archiver's to hold. What the floor is, and why no trim
# from anywhere else may touch it, is the info.registry row of
# ../docs/STREAMS.md.
#
# BEING WRONG ABOUT IT WAS CHEAPER THAN THIS FILE SAID, and the correction is
# recorded because being wrong about the cost of a grant is how a grant gets
# kept.
# The claim was "a diagnosis (NOPERM, classified transient, widened live)". A
# NOPERM on XTRIM never reaches archiver's transient classifier: `trim_stream`
# catches everything and logs one WARNING per ~20 drain iterations
# (`journalctl -u archiver | grep 'Stream trim failed'`), and the stream grows
# until this repo's probe reports its length. A new stream archiver starts
# producing no longer meets this selector at all: since CannObserv/archiver#239
# it joins no trim set by default. A NOPERM on XTRIM now means archiver widened
# `trim_topics` without the matching grant here - which the two pinning tests
# above exist to stop at review - and it surfaces the same way.
#
# THE DEAD-LETTER DISPOSAL IS `+xdel` ALONE, and it issues once archiver v4.17.0
# deploys. `+xdel` on content.revisions.dlq and content.artifacts.dlq is
# archiver's drainer role (`DLQ_DRAINERS`), and its caller is the triage tooling
# of CannObserv/archiver#238: `TRIAGE_DLQS` in src/core/changes/dlq_triage.py,
# pinned there by test_triage_dlqs_are_the_two_queues_broker_grants_xdel_on.
# Until that deploys it issues from nothing, and it has to be in place before
# archiver v4.17.0 deploys: without it the discard route returns 503 (NOPERM). `+xtrim` on both queues
# came off in CannObserv/broker#59, having never been issued. The triage
# disposes by XDEL of the exact ids an operator named and never trims - an
# `XTRIM MINID` boundary chosen after the read also removes an entry that
# landed during it, and a cap would erase the non-zero depth the probe's DLQ
# check reads as a dead letter awaiting triage. `+xadd` on both queues is live: co-core-aio's
# `dead_letter` writes them from the group-consumer driver both of archiver's
# consumers run.
#
# FOUR WRITE SELECTORS, AND WHAT EACH LEAVES OUT IS THE POINT. content.replicate
# and info.registry are in a `+xadd` selector and in no `+xtrim` selector on the
# instance, so archiver can publish to both and cap neither. That is
# ../docs/STREAMS.md's **Never XTRIMmed**, on two rows for two reasons - a cap on
# a command stream deletes commands not yet delivered; a trim on the registry
# from anywhere but its publish cuts under the floor consumers boot from - and
# until broker#14 and broker#34 it was held only in archiver's own source, as
# `no_trim_topics` in its drain loop, while the broker permitted what its own
# inventory forbids. The two `+xadd` selectors could be one: they differed by
# `+xtrim` until broker#34, which kept them as it found them.
user archiver on >__ARCHIVER_PW__ resetchannels ~info.changes ~info.registry ~info.watch-status ~content.revisions ~content.revisions.dlq ~content.artifacts ~content.artifacts.dlq ~content.replicate +xread +xreadgroup +xack +xautoclaim +xgroup|create +xlen +xrange +xpending +xinfo|stream +exists +info +ping (+xadd ~content.replicate) (+xadd ~info.changes ~info.registry ~content.revisions.dlq ~content.artifacts.dlq) (+xtrim ~info.changes) (+xdel ~content.revisions.dlq ~content.artifacts.dlq)

# --- watcher ------------------------------------------------------------------
# ~content.blobs.dlq covers a path with NO CALLER TODAY: watcher's blobs loop
# acks past an undecodable frame rather than quarantining it (watcher#288). The
# grant stays because a path that acquires a caller under an ACL that forbids it
# fails at the worst possible moment.
#
# No +xinfo and no +xgroup|destroy: watcher#286 deleted the legacy-group
# migration that needed them. Sequencing, not a grant.
user watcher on >__WATCHER_PW__ resetchannels ~content.fetch ~content.fetch-policy ~content.revisions ~content.blobs ~content.blobs.dlq ~info.watch-status ~info.registry +xread +xreadgroup +xack +xautoclaim +xgroup|create +xlen +xrange +xinfo|stream +info +ping (+xadd +xtrim ~content.fetch ~content.fetch-policy ~content.revisions ~info.watch-status ~content.blobs.dlq) (+xdel ~content.blobs.dlq)

# --- replicator ---------------------------------------------------------------
# +xrange is load-bearing and was missing from the draft. The anomaly
# dead-letter route - a frame that never decoded, so there is no field map to
# copy - re-reads the entry with XRANGE <topic> <id> <id> before writing the DLQ
# copy (replicator#79). A grant covering the write but not the re-read jams
# exactly the poison frames the DLQ exists to quarantine, which is the
# content.fetch.dlq failure mode that reached 110 entries in archiver#162.
#
# ~replicator:cmd:* is not a stream: replicator uses the broker as expiring
# state via SET .. NX EX, one de-duplication key per completed command, read
# back by an EXISTS before the next handler runs. What they guard is answered in
# replicator's docs/CONVENTIONS.md and inventoried in ../docs/STREAMS.md,
# "Non-stream keys on db0" (broker#9, replicator#80).
#
# THE PATTERN IS THE NAMESPACE, NOT ONE SEGMENT OF IT, and the narrower version
# was correction eleven in its key-pattern form. The keyspace is per command
# stream - replicator:cmd:fetch:<id> and replicator:cmd:replicate:<id> - and
# this line read ~replicator:cmd:fetch:* until broker#9. Nothing could have
# observed the gap: the replicate loop has never completed a command while no
# alias table is provisioned, so its namespace is EMPTY RATHER THAN ABSENT, and
# a grant derived from what was on the wire cannot see a namespace with no
# traffic. The moment that loop completes one - which is what broker#7 exists to
# make happen - the EXISTS before the handler is denied, replicator#82
# classifies NOPERM transient, and the loop backs off and retries forever
# without ever running a handler. Nothing lost, nothing progressing.
# tests/deploy/test_redis_acl.py derives the namespaces from co-core's command
# taxonomy, so a third command stream cannot arrive without a grant or a red
# test.
#
# WHAT +set COST, AND WHERE IT WENT. A Redis ACL key pattern applies to every
# command the user holds, so `+set` on the root permission set was not scoped to
# `~replicator:cmd:*` - it landed on every stream pattern on this line too, and
# `SET content.fetch <string>` would have replaced a live stream, its groups and
# their PELs with a string.
#
# **This stanza used to say the shape was not closeable, and that was wrong.** It
# said "there is no ACL grammar for 'this command on that pattern only'", which
# is true of `%R~`/`%W~` - they scope read versus write, not command - and false
# of the mechanism that exists for exactly this: a **selector**. Verified on
# 7.0.15 while adding the `+xdel` selectors, which is how the error surfaced;
# left as follow-on work then, because moving `+set` changes a grant three loops
# depend on where correcting a falsehood does not. broker#14 moved it, in the
# pass that moved `+xadd` and `+xtrim` for the same reason: `(+set
# ~replicator:cmd:*)` confines SET to the dedupe namespace, so the paragraph
# above now describes a closed hazard. The mitigation it replaces - a narrow
# command list, and nothing in replicator issuing SET against a topic - was a
# property of the client's source, which is the kind this file exists to stop
# relying on.
#
# +exists was MISSING and it wedged the fetch loop. CannObserv/replicator#79
# listed EXISTS in its observed inventory; the ACL draft attributed it to the
# probe and the DLQ drainer instead, granted it to archiver, and left it off
# here with a note to confirm. The note was never actioned. The consequence,
# once replicator#85 brought the group loops back to life: every fetch command
# was delivered, denied at EXISTS, retried, and never acked - XPENDING climbed
# 2 -> 3 with delivery counts of 77, 47 and 14 on three commands.
#
# Nothing was lost, and that is the whole design working: replicator#82
# classifies NOPERM transient, so the loop backed off instead of burning the
# delivery ceiling and closing valid commands as fetch_failed. The bus-health
# probe's two-tick XPENDING rule caught it, the notifier check-in put it in
# front of a person, `ACL LOG` named the command in one query, and `acladmin`
# widened the grant live with no restart. The PEL drained to 0 immediately.
#
# The lesson is narrower than "test more": an observed command inventory is
# only as good as its attribution. EXISTS was seen on the wire and assigned to
# the wrong client.
#
# +xpending WAS MISSING TOO, and what it disarmed was the delivery ceiling
# (broker#39). `_delivery_count` (src/worker/loop.py:711,
# CannObserv/replicator@bee66d9) reads one entry's `times_delivered` with
# XPENDING <topic> <group> <id> <id> 1, and its only caller is
# `_handle_unclassified`: the REPLICATOR_MAX_DELIVERY_ATTEMPTS limit, default 5,
# on a failure the loop cannot classify. Refused, the read raises
# NoPermissionError from inside `process_message`'s `except Exception` arm,
# where replicator#82's transient classification - a sibling arm - never sees
# it. It escapes before anything is dead-lettered, `run_loop` logs
# "poll cycle failed" at ERROR and backs off, and `claim_stale` brings the entry
# back to fail the same way: a handler bug retried forever instead of
# dead-lettering. Replicator's `_report_or_none` docstring (loop.py:381)
# describes this path for a raising report builder, and it fits a refused read
# word for word: "The ceiling can never fire, because the ceiling is the code
# that is failing."
#
# MONITOR could not have seen it, for the dedupe namespace's reason rather than
# EXISTS's: the path runs only after a handler fails in a way the loop cannot
# classify, and none did while either capture ran. `ACL LOG` recorded it, twice,
# about 2026-09-22T12:55:43Z from replicator's node; whether the worker or an
# operator following replicator's docs/COMMANDS.md sent it is
# CannObserv/replicator#107's to answer, and the grant is owed either way.
#
# On the root permission set, not a selector: the selectors on this line
# confine XADD, XTRIM, SET and XDEL to the keys each may change, and XPENDING
# changes nothing. `denyoom`-admitted, so it still answers at the memory cap.
# Granted live 2026-09-22T14:49Z.
user replicator on >__REPLICATOR_PW__ resetchannels ~content.fetch ~content.fetch.dlq ~content.fetch-policy ~content.blobs ~content.replicate ~content.replicate.dlq ~content.artifacts ~replicator:cmd:* +xread +xreadgroup +xack +xautoclaim +xgroup|create +xlen +xrange +xpending +xinfo|stream +exists +info +ping (+xadd +xtrim ~content.blobs ~content.artifacts ~content.fetch.dlq ~content.replicate.dlq) (+set ~replicator:cmd:*) (+xdel ~content.fetch.dlq ~content.replicate.dlq)

# --- brokeradmin --------------------------------------------------------------
# The bus-health probe and the backstop DLQ drainer. Instance-wide by nature:
# INFO memory has no key, and the DLQ sweep is `SCAN MATCH *.dlq` precisely so it
# finds queues nobody declared.
#
# It is also THE OPERATOR'S READ-ONLY IDENTITY - `rcli brokeradmin` in every
# runbook under ../docs is this user - and the third caller is this repo's own
# deploy tests, which hold the live broker to the tracked files as this user and
# no other. So a grant the probe does not issue is not residue by default; it
# has to NAME the caller it serves, because from `src/broker/` alone every one
# of the three looks identical. broker#32 decided that for `+xpending`, and
# ../tests/deploy/test_redis_acl.py now asks the question of every command on
# this line rather than waiting for someone to notice the next one.
#
# Narrowed from the draft's `~* &* +@all`. It reads everything and disposes of
# dead-letter entries; it has no reason to XADD, and none to CHANGE an ACL,
# CONFIG SET, FLUSHDB or replicate. It does now READ the ACL (see below), and
# read-versus-change is exactly the line `acladmin` exists on the other side of.
#
# `+xtrim` JOINED THE `+xdel` SELECTOR in broker#14 rather than being dropped.
# On the root permission set it rode `~*`, so the one identity that can see
# every stream on this instance could also cap any of them - `content.replicate`
# included, which nothing may cap. Scoped to `~*.dlq` it is still the drain
# ../docs/STREAMS.md documents for a queue nobody claimed (that `XTRIM MINID`
# procedure runs as this user), and the glob is deliberate for the same reason
# the deletion glob is: the queue this exists for is by definition one nobody
# declared.
#
# THE CONFINEMENT IS A CAPABILITY WITHHELD ON PURPOSE, and since broker#34 it is
# the last thing standing. This is the credential an operator holds at a
# `redis-cli`, `default` is off, and no service selector names content.replicate
# or info.registry for `+xtrim` - so nothing on this instance can XTRIM either,
# and `~*.dlq` here is what keeps it so. Both rows of ../docs/STREAMS.md say
# **Never XTRIMmed**: a cap on the command stream deletes commands its group has
# not been delivered, and a trim on the registry cuts under the floor its
# consumers replay from `0-0` at boot, so the next one converges to a partial
# set and reports success. Trimming a big stream is the obvious move in a memory
# incident, and widening this selector is one `ACL SETUSER` as `acladmin`. If
# one is ever needed, it names the stream after reading that stream's row, never
# `~*`, and comes off again - test_live_acl_matches_tracked_acl.py reports one
# left in place.
#
# "Reachable over loopback only" is NOT enforceable - Redis has no per-user
# source restriction. What protects this user is that its password never leaves
# the node. Say it that way round, so nobody later relies on a constraint that
# does not exist.
#
# +xlen ISSUES FROM NOTHING TODAY, and is kept deliberately. broker#13 replaced
# the probe's XLEN calls with the `length` field of the XINFO STREAM reply it was
# already making - one atomic observation instead of two reads a write can land
# between - so `grep -rn xlen src/` now finds only docstrings. It stays because
# it is strictly weaker than the `+xinfo` above: XLEN returns one number XINFO
# STREAM already carries, so removing it narrows nothing an attacker could reach
# and costs a live ACL change plus a test rewrite. Recorded rather than left for
# someone to rediscover, because this file's header says the command lists are
# OBSERVED, and an unused grant is the one kind of entry that claim cannot
# explain by itself.
#
# +xpending ISSUES FROM NOTHING TODAY EITHER, and is kept for a different reason
# than `+xlen` above: not that it is weaker than a grant already held, but that
# it belongs to the other caller. broker#29 moved the probe's pending count onto
# the `pending` field of the XINFO GROUPS reply it was already making - one
# observation carrying the group's position, its pending count and its existence
# - so the only `xpending` left under `src/` is a comment naming redis-py's own
# parser, in the branch that reads a group's absence. What that did not
# move is the TRIAGE query. Per entry, `XPENDING <stream> <group> - + 10` names
# the consumer holding it and HOW OFTEN IT HAS BEEN DELIVERED, and nothing else
# on this line can. XINFO GROUPS gives one total for the group; XINFO CONSUMERS
# - which `+xinfo` already permits, so the "strictly weaker than a grant already
# held" argument that keeps `+xlen` does NOT reach this one - gives a
# per-consumer total and an idle time, with no entry ids and no delivery count.
# A delivery count climbing while the total stands still is delivery without an
# ack, the shape ../docs/ACL-CUTOVER.md records from the EXISTS denial: 77, 47
# and 14 on three commands. Cutting this grant would
# take the operator's next step after this probe's own finding - a pending count
# non-zero across two consecutive ticks - and leave that finding with nowhere to
# go. Read-only and `denyoom`-admitted, so it still answers at the memory cap,
# which is where triage actually happens. ../docs/RECOVERY.md step 4 issues it
# beside the XINFO GROUPS loop it follows from, which is what makes this a grant
# with a caller rather than a grant with an argument (broker#32).
#
# +ping IS NOT THE PROBE'S EITHER. Its tick opens with INFO, and it sets no
# `health_check_interval`, so redis-py sends no PING on its behalf. The callers
# are the other two: ../docs/ACL-CUTOVER.md pings as every credential in turn,
# this one included, to verify a flip locked nobody out, and
# ../tests/deploy/conftest.py's `live_client` uses it to decide the node is
# answering at all before it asserts anything about it.
#
# +client|list and +acl|log are the NODE'S DIAGNOSTICS, and they are here because
# `user default off` would otherwise take them away from everybody. No service
# user holds them and none should. Both earned their place during the cutover:
# `ACL LOG` found archiver's `config|get` denial in one command, where the
# alternative was reading three services' journals on two hosts this node
# deliberately cannot reach; and `CLIENT LIST`'s `flags=b` is the only reliable
# way to tell a blocked consumer from a client that merely ran a read once -
# `XINFO CONSUMERS` idle does NOT update on an empty read, and consumers=0 on a
# stream that has never carried a message means nothing at all.
#
# `+acl|log` also permits `ACL LOG RESET`; Redis has no finer granularity, and
# being able to read the log is worth more than being unable to clear it.
#
# +acl|getuser IS THE MIRROR TEST, and it is here because nothing was checking
# the half of every ACL change that happens in a text editor (broker#11). The
# change mechanism this file is built around is `ACL SETUSER` live as `acladmin`
# and then mirror it here - and that second half rested on someone remembering
# four times: eleven corrections in broker#2, step 4 of the restart window, and
# broker#9's key pattern. `CONFIG GET` closes the same gap for redis.conf;
# tests/deploy/test_live_acl_matches_tracked_acl.py closes it for this file, by
# loading the tracked copy into a throwaway server and asking both the same
# question. A byte comparison could not: `ACL SAVE` rewrites in canonical form.
#
# Read-only, and on the observer side of the observer/changer split - that split
# is about CHANGING. What it does expose to the probe's credential is each
# user's password HASH, unsalted sha256 of a 40-character random secret, to a
# user that already reads every key and every stream on the instance.
#
# It CANNOT ENUMERATE, and that is a real limit rather than a caveat.
# `+acl|getuser` permits `ACL GETUSER` alone: `ACL USERS`, `ACL LIST`,
# `ACL WHOAMI` and `ACL CAT` are each denied separately, verified on 7.0.15. So
# a user this file never declared is invisible to a per-name lookup. The halves
# that matter are covered without it: `+client|list` above reports the `user=`
# on every connection, so an untracked identity in USE is caught; and on the
# node the saved aclfile, read through `sudo -n`, lists every user it holds, so
# one that was SAVED is caught too (CannObserv/broker#54). What is left - idle
# and never saved - is gone at the next restart. `+acl|users` (names only, no
# hashes) would close that too, and is deliberately not granted.
#
# +config|get IS THE CONFIG MIRROR TEST, and it reads `requirepass` too.
# tests/deploy/test_live_broker_matches_tracked_config.py reads `CONFIG GET *`
# back against redis.conf.broker; the probe itself takes the cap from
# `INFO memory`. Redis cannot grant the parameter without the rest
# (CannObserv/broker#50), so `default`'s break-glass password is readable to
# this identity - after a restart, the current one - and a rotation is not a
# secret from it. That is accepted, not overlooked: this is the node's own
# credential, and what actually guards the break-glass is the aclfile plus root
# on this node. It is the only user holding the grant.
user brokeradmin on >__BROKERADMIN_PW__ resetchannels ~* +info +ping +scan +exists +xlen +xrange +xinfo +xpending +config|get +client|list +acl|getuser +acl|log (+xdel +xtrim ~*.dlq)

# --- acladmin -----------------------------------------------------------------
# Break-glass, and it exists because `user default off` otherwise makes every
# grant permanent.
#
# The whole cutover rests on one recovery story: a rule that is too narrow
# produces NOPERM, all three participants classify that transient so they back
# off instead of losing data, and an operator widens the grant live with one
# `ACL SETUSER`. **`ACL SETUSER` needs `+acl`, and after `default off` no user
# had it** - not brokeradmin, not any service. So the documented recovery would
# have meant editing this file and restarting redis-server, which on this
# instance is a cohort-wide event. An ACL nobody can widen without a window is
# exactly what this file's own header says it must not become.
#
# Deliberately separate from brokeradmin rather than folded into it. brokeradmin
# holds `~*` because INFO and the DLQ sweep need it, so its narrow command list
# is the only boundary it has; `+acl` would let it grant itself `+xadd` and that
# boundary would become advisory. Split, the observer cannot change anything and
# the changer cannot read anything.
#
# Nothing runs as this user. It is for a human, at a prompt, during an incident.
user acladmin on >__ACLADMIN_PW__ resetchannels ~* +acl +ping

# --- citest -------------------------------------------------------------------
# R4's answer on the topic-name axis. Redis ACLs cannot partition by database
# index at all, so the db15 guard was never the enforcement - a credential that
# cannot NAME a production topic is. The database-index axis is closed
# separately by `databases 1` (#5); neither substitutes for the other.
user citest on >__CITEST_PW__ resetchannels ~probe.* ~replicator.itest.* +@all -@admin -@dangerous

# --- default ------------------------------------------------------------------
# OFF SINCE 2026-09-10, AND THIS LINE MUST NEVER BE DELETED.
#
# Two things are true at once here and both of them bite.
#
# 1. **Omitting `default` from an aclfile silently makes it `nopass`.** Verified
#    on a scratch instance: with `requirepass` set in redis.conf and an aclfile
#    that does not mention `default`, an ANONYMOUS client gets `PONG` - while
#    `CONFIG GET requirepass` still returns the password, so every check anyone
#    would think to run still says auth is on. The ACL subsystem owns `default`
#    once an aclfile exists, and it defaults to `nopass ~* &* +@all`. That is R2
#    exactly - a tailnet-bound broker reachable by every node the policy admits,
#    including a user-owned one - arriving as a side effect of turning on the
#    mechanism that was supposed to tighten it. So the line stays.
#
# 2. **`user default off` at the FIRST load locks out every service still on
#    `default:`.** On this cluster that restart happened on 2026-09-10 with the
#    line reading `on` and __DEFAULT_PW__ equal to the then-current `requirepass`,
#    so nothing changed for anyone; each service, then the probe, moved onto its
#    own credential live; and step 4 of docs/ACL-CUTOVER.md flipped it `off`
#    the same day, as `acladmin`, with zero clients still authenticated as
#    `default`. A NEW cluster repeats that order: `on` for the first load,
#    migrate, then `off` live. Never `off` first.
#
# THAT PASSWORD IS ROTATABLE, AND WAS ROTATED ON 2026-09-23 (broker#46). `off`
# is not the end of its exposure: opening any restart window, step 4's rollback
# and the last-resort `aclfile`-commented-out restart all turn it back into a
# live credential, and every service held it before the cutover - so when it
# leaks it is rotated, in four places at once or a restart reverts part of it.
# ../docs/ACL-CUTOVER.md, "Rotating __DEFAULT_PW__". Nothing here changes: the
# placeholder is what this file tracks, which is the point of the placeholder.
#
# The tracked line says `off` so that a re-render onto a rebuilt node (broker#4)
# cannot quietly reopen the shared password. It KEEPS its password while
# disabled, and that is not redundancy: `off` is a flag and leaves the password
# set intact, and the rollback is `ACL SETUSER default on` - which on a line
# carrying no password would enable a `nopass` user holding `+@all`. The
# password on a disabled user is what makes the rollback land somewhere safe.
# tests/deploy/test_redis_acl.py pins all three properties.
#
# `default` is now the WINDOW-ONLY identity. Between windows no user can run
# `CONFIG SET`, `BGREWRITEAOF`, `SHUTDOWN` or `FLUSHDB`, by design; a restart
# window, or an incident that needs one of those, begins by re-enabling it and
# ends by disabling it again - both live, both one line, both as `acladmin`:
#
#     rcli acladmin ACL SETUSER default on     # open / rollback
#     rcli acladmin ACL SETUSER default off    # close
#     rcli acladmin ACL SAVE                   # after either
#
# `rcli` is the runbooks' helper, defined at the top of ../docs/RESTART-WINDOW.md:
# it passes the password in REDISCLI_AUTH rather than in a URL, so no credential
# reaches a command line (CannObserv/broker#47).
#
# Verified at the flip: anonymous PING -> NOAUTH; AUTH with the shared password
# -> WRONGPASS; every other user PONG on a fresh connection; all ten service
# connections untouched.
user default off >__DEFAULT_PW__ ~* &* +@all
