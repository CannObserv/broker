# CannObserv/broker#1 - tailnet ordering for the change-bus broker.
#
# The bind list in redis.conf includes this host's tailnet address, which
# tailscaled assigns at boot. Without the ordering below, redis-server races it
# and dies on an unavailable bind - observo#473, which cost that repo two weeks
# of silently starved jobs. After= handles the common case; the ExecStartPre is
# the insurance that makes a slow tailscaled loud rather than a crash-loop.
#
# The '+' prefix is load-bearing and was NOT obvious. Ubuntu's packaged
# redis-server.service hardens with:
#     NoExecPaths=/
#     ExecPaths=/usr/bin/redis-server /usr/lib /lib
# so nothing else on the filesystem is executable for this unit, and a plain
# ExecStartPre fails 203/EXEC. '+' runs the command with full privileges outside
# the sandbox, which leaves redis's own hardening completely intact - strictly
# better than widening ExecPaths= to cover bash and coreutils.
#
# This is a cousin of observo#479, and worth contrasting: there, the sandbox
# broke an 'ip'-based probe SILENTLY (AF_NETLINK blocked, probe still exits 0).
# Here it fails loudly. The probe reads /proc/net/fib_trie precisely because
# RestrictAddressFamilies on this unit does not include AF_NETLINK either.
#
# Restart limits widen to match: a slow tailscaled handshake must not exhaust
# the budget before the wait has done its job.
[Unit]
After=tailscaled.service
Wants=tailscaled.service
StartLimitIntervalSec=900
StartLimitBurst=10

[Service]
ExecStartPre=+/usr/local/sbin/wait-for-tailnet-addr.sh 100.97.91.19 90
