# broker#21. Keeps the bus's pages from being reclaimed under pressure created
# outside system.slice - VSCode Server and Claude Code run in init.scope, where
# no slice limit reaches them. Twice maxmemory: the dataset plus a background
# save's or AOF rewrite's copy-on-write. Protection, not a limit.
#
# OOMScoreAdjust: at the default 0 this unit was earlyoom's victim despite
# --avoid, while dev tooling inherits exe.dev's -1000 and is never one (broker#58).
# -900 takes it out of earlyoom's reach. -900, not -1000: see
# test_the_bus_scores_below_what_exe_dev_starts. Applies at exec; a running
# redis-server takes it live with `choom -n -900 -p <pid>`.
#
# Separate from broker.conf, which is unit ordering only. MemoryLow is effective
# only with system.slice.d/broker-memory.conf.
[Service]
MemoryLow=1G
OOMScoreAdjust=-900
