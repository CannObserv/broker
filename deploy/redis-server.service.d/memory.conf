# broker#21. Keeps the bus's pages from being reclaimed under pressure created
# outside system.slice - VSCode Server and Claude Code run in init.scope, where
# no slice limit reaches them. Twice maxmemory: the dataset plus a background
# save's or AOF rewrite's copy-on-write. Protection, not a limit.
#
# Separate from broker.conf, which is unit ordering only. Effective only with
# system.slice.d/broker-memory.conf.
[Service]
MemoryLow=1G
