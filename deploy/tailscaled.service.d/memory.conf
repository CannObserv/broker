# broker#21. The node's network path: on 2026-09-16 tailscaled was one of the
# processes whose allocations failed. ~60 MiB resident. MemoryLow is effective
# only with system.slice.d/broker-memory.conf; OOMScoreAdjust as for
# redis-server.service.d/memory.conf.
[Service]
MemoryLow=128M
OOMScoreAdjust=-900
