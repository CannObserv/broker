# Tuning for the Cannabis Observer change-bus broker (CannObserv/broker#1).
#
# !! DO NOT INSTALL THIS AS broker.conf. !!
#
# That filename on the broker node holds a DIFFERENT drop-in - broker#1 Phase
# 2's tailnet ordering (After=tailscaled.service plus the /proc/net/fib_trie
# wait). Overwriting it re-opens the boot race R1 exists for.
#
# And nothing needs installing today: the four settings below are already in
# force on the node, appended to /etc/redis/redis.conf by Phase 2 rather than
# supplied by a drop-in. This file came from archiver, where a drop-in was the
# only mechanism; on a dedicated host it is not the mechanism chosen. Phase 1
# step 1 posed exactly that question ("keep layering on Debian's package unit
# or own the whole thing") and Phase 5 is where the repo and the node get
# reconciled. Until then this is the tracked *statement* of the tuning, and
# tests/deploy/ asserts only the invariant that survives either answer: the cap
# is explicit and non-zero.
#
# The file remains a valid drop-in. If a future decision keeps it, install it
# under its own name so both survive - systemd merges every *.conf in the
# directory:
#
#   sudo cp deploy/redis-server.dropin.conf \
#       /etc/systemd/system/redis-server.service.d/broker-tuning.conf
#   sudo systemctl daemon-reload && sudo systemctl restart redis-server
#
# It overrides ExecStart to append persistence + eviction flags as CLI args
# (which override the same directives in /etc/redis/redis.conf), so the
# package's redis.conf stays untouched and everything tuned here lives in this
# one tracked file.
#
# Provenance: moved from CannObserv/archiver's deploy/ (archiver#109, #128)
# under archiver#193 D6, when the broker stopped sharing a host with archiver.
# The install path changed with it - `broker.conf`, not `archiver.conf` - so a
# host that still carries the old filename is a host that has not been cut over.
#
# Durability: AOF (appendfsync everysec) makes the stream + consumer-group state
# survive a broker restart. Each producer's own durable buffer stays the
# producer-side source of truth; AOF covers consumer-side in-flight state.
# maxmemory-policy noeviction: a stream broker must never silently evict
# entries under memory pressure - better to error and let the producers retry.
#
# An explicit --maxmemory (CannObserv/archiver#128): noeviction WITHOUT a cap is
# inert. With the default `maxmemory 0` there is no ceiling to refuse writes at,
# so an untrimmed stream does not produce the retryable write errors this
# drop-in's noeviction line assumes - it grows until the kernel OOM-killer takes
# redis-server, costing the whole broker plus an AOF-replay restart. The cap
# restores the intended failure mode: bounded, instance-wide `OOM command not
# allowed` errors.
#
# THE SEAM THAT SPANS TWO REPOSITORIES. That error is classified TRANSIENT in
# `_TRANSIENT_PUBLISH_ERRORS`, CannObserv/archiver:src/core/changes/publisher.py,
# whose outbox retries through it instead of dead-lettering valid events. The cap
# and that classification are one decision made in two repos with no test
# spanning them - archiver's copy names this file in return. Do not change either
# alone (archiver#193 R5).
#
# Note the blast radius is instance-wide: every producer on this broker is
# refused, and only archiver's is known to retry. See the `Producer durability
# under OOM` column in docs/STREAMS.md.
#
# Sizing: ~780 bytes/entry on info.changes, so its 100k-entry
# ARCHIVER_REDIS_STREAM_MAXLEN default is ~78MB; the value on the ExecStart line
# below leaves roughly 6x headroom for the other streams while staying far under
# this node's RAM. That line is the single authoritative statement of the value -
# deliberately not repeated here or in docs/STREAMS.md, so there is nothing to
# drift. Raise it if the stream inventory in docs/STREAMS.md grows; it is a
# ceiling, not a reservation.
#
# NOTE: the ExecStart below reproduces the stock unit's command
#   /usr/bin/redis-server /etc/redis/redis.conf --supervised systemd --daemonize no
# (verified via `systemctl show redis-server -p ExecStart`). If a distro upgrade
# changes that command, refresh this line to match.
[Service]
ExecStart=
ExecStart=/usr/bin/redis-server /etc/redis/redis.conf --supervised systemd --daemonize no --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --maxmemory 512mb
