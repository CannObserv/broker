# broker#21: a reserve for atomic allocations.
#
# On 2026-09-16 the then-2 GB node failed GFP_ATOMIC allocations in kswapd0,
# tailscaled and ksoftirqd - softirq context, which cannot reclaim - while
# nothing was OOM-killed. The bus's network path degraded and the probe went
# silent. This is the pool those allocations draw on. The kernel derives it
# from RAM (5,663 kB at 2 GB, 11,399 kB at 8 GB); 64 MiB is under 1% of 8 GB.
vm.min_free_kbytes = 65536

# broker#26: what redis asks for at every start, and the measurement that says
# it changes nothing here.
#
# `checkOvercommit` warns on any value but 1, about the kernel refusing a save's
# fork. Measured on this kernel (6.12.93) with untouched private anonymous
# mappings: mode 0 granted 7.29 GiB - more than MemAvailable (~6.3 GiB) - and
# refused only 8.75 GiB, MemTotal + 1 GiB. It ignores free memory, so with no
# swap it refuses just one request bigger than RAM, and a fork commits at most
# redis's own private memory, which `maxmemory` bounds. Set for the WARNING,
# not for the fork: a warning that recurs at every start and is known to be
# inert is worse than the setting that silences it.
#
# What it costs: an allocation larger than the whole machine now fails at first
# touch - an OOM kill, in the order the files beside this one fix, and never of
# dev tooling at -1000 - rather than up front with ENOMEM. Re-measure after a
# kernel change.
vm.overcommit_memory = 1
