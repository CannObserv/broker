# broker#21: a reserve for atomic allocations.
#
# On 2026-09-16 the then-2 GB node failed GFP_ATOMIC allocations in kswapd0,
# tailscaled and ksoftirqd - softirq context, which cannot reclaim - while
# nothing was OOM-killed. The bus's network path degraded and the probe went
# silent. This is the pool those allocations draw on. The kernel derives it
# from RAM (5,663 kB at 2 GB, 11,399 kB at 8 GB); 64 MiB is under 1% of 8 GB.
vm.min_free_kbytes = 65536
