name: audit

# uv.lock against OSV (#86). It is the update mechanism patching-hosts' record
# cites (run.md section 7). Dependabot's uv ecosystem and Renovate are out:
# neither updater can sync the private wheelhouse co-core resolves from.
# Dependabot moves the action pins alone (.github/dependabot.yml, #90).
#
# Report-only: scripts/audit_lock.sh always exits 0, and a finding is a warning
# annotation plus the job summary. A red gate here would turn main red on
# someone else's disclosure date and block every later check-in (#79). Push and
# PR runs read the lock a change ships. The weekly run reads the lock nobody
# touched, since disclosures arrive without commits.
#
# No secret and no OIDC token: `uv audit --frozen` reads uv.lock without the
# wheelhouse, so it needs no WIF. tests/deploy/test_lock_audit.py pins this.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: uv audit (report-only)
    # The node's image, not ubuntu-latest (#88): tests/deploy/test_workflow_pins.py.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # --frozen downloads no package, so there is nothing to cache.
          enable-cache: false

      - name: uv audit --frozen
        run: bash scripts/audit_lock.sh
