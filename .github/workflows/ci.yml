name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: lint + test
    # The node's image, not ubuntu-latest (#88): tests/deploy/test_workflow_pins.py.
    runs-on: ubuntu-24.04
    # WIF: mint an OIDC token for google-github-actions/auth to impersonate the
    # read-only co-pypi-reader SA, whose access token reads co-core from the
    # co-pypi index (#144; processor#121, watcher#358). The provider's attribute
    # condition has to admit this repository.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # SHA-pinned: setup-uv publishes no floating major tag since v8 (#88).
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # Not the default since v9. Unpruned, the saved cache holds co-core
          # unpacked from the private co-pypi index, in a public repo's cache.
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Authenticate to Google Cloud (WIF, read-only)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com
          # For the co-pypi index's basic auth (#144); a masked step output.
          token_format: access_token

      - name: uv sync
        # The co-pypi pair, on this step alone (#144, as processor#121): co-core
        # comes from the index, and every later `uv run` finds the venv synced
        # and downloads nothing. --locked: the lock as committed, each file held
        # to its sha256. A masked output; never echo it.
        env:
          UV_INDEX_CO_PYPI_USERNAME: oauth2accesstoken
          UV_INDEX_CO_PYPI_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: uv sync --locked --group dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: shellcheck
        # A step, not a job: scripts/deploy.sh's CI_JOBS gate covers it as is (#112).
        run: bash scripts/shellcheck.sh

      - name: pytest
        run: uv run pytest
