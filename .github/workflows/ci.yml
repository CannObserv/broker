name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily (#147). A schedule and a dispatch always run the pytest job, so they
    # are the only runner runs an attested, directly shipped commit gets, and
    # what scripts/deploy.sh deploys one from: docs/CI.md, *The local gate's
    # attestation*.
    - cron: "37 6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: lint + test
    # The node's image, not ubuntu-latest (#88): tests/deploy/test_workflow_pins.py.
    runs-on: ubuntu-24.04
    # WIF: mint an OIDC token for google-github-actions/auth to impersonate the
    # read-only co-pypi-reader SA, whose access token reads co-core from the
    # co-pypi index (#144; processor#121, watcher#358). The provider's attribute
    # condition has to admit this repository.
    permissions:
      contents: read
      id-token: write
      # The attest step reads the combined status (#147). Here, not at the top:
      # a job's own permissions replace the workflow's.
      statuses: read
    outputs:
      attested: ${{ steps.attest.outputs.attested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # SHA-pinned: setup-uv publishes no floating major tag since v8 (#88).
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          # Not the default since v9. Unpruned, the saved cache holds co-core
          # unpacked from the private co-pypi index, in a public repo's cache.
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Authenticate to Google Cloud (WIF, read-only)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com
          # For the co-pypi index's basic auth (#144); a masked step output.
          token_format: access_token

      - name: uv sync
        # The co-pypi pair, on this step alone (#144, as processor#121): co-core
        # comes from the index, and every later `uv run` finds the venv synced
        # and downloads nothing. --locked: the lock as committed, each file held
        # to its sha256. A masked output; never echo it.
        env:
          UV_INDEX_CO_PYPI_USERNAME: oauth2accesstoken
          UV_INDEX_CO_PYPI_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: uv sync --locked --group dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: shellcheck
        # A step, not a job: scripts/deploy.sh's CI_JOBS gate covers it as is (#112).
        run: bash scripts/shellcheck.sh

      - name: attest
        # Did shipping-work's push.sh post gate/local = success on this commit,
        # the local gate having passed on its exact tree (#147,
        # gregoryfoster/skills#688)? Last, so the post, seconds after the push,
        # has landed: a read that beats it runs the full tier. A refused read
        # fails the job: loud, never a silent skip.
        id: attest
        env:
          GH_TOKEN: ${{ github.token }}
          # The PR's head. On pull_request, github.sha is the merge commit,
          # which nobody gated.
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The combined status keeps each context's latest state; /statuses
          # lists every status ever posted. A page is 30 contexts unless asked.
          n=$(gh api "repos/${{ github.repository }}/commits/$HEAD/status?per_page=100" \
                --jq '[.statuses[] | select(.context == "gate/local" and .state == "success")] | length')
          echo "attested=$([ "$n" -gt 0 ] && echo yes || echo no)" >>"$GITHUB_OUTPUT"

  pytest:
    name: pytest
    # The heavy tier, a job of its own (#147): skipped, it reads "skipped",
    # which scripts/deploy.sh refuses; a skipped step would leave a job green.
    needs: test
    # Skipped only for an attested commit, on a branch push or a person's pull
    # request from this repository: never a bot's PR or a fork's, which no local
    # gate ran, and never a schedule, a dispatch, a tag or pull_request_target.
    # !cancelled() in place of the implied success(): a lint failure still runs
    # the tests, its attest output empty. tests/deploy/test_ci_attestation.py
    # evaluates this over every case.
    if: >-
      (needs.test.outputs.attested != 'yes'
      || (github.event_name != 'push' && github.event_name != 'pull_request')
      || startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'pull_request'
          && (github.event.pull_request.user.type == 'Bot'
              || github.event.pull_request.head.repo.full_name != github.repository)))
      && !cancelled()
    runs-on: ubuntu-24.04
    # Its own venv, so its own WIF read of the co-pypi index, as lint + test's.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Authenticate to Google Cloud (WIF, read-only)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com
          token_format: access_token

      - name: uv sync
        # The co-pypi pair on this step alone, as in lint + test (#144).
        env:
          UV_INDEX_CO_PYPI_USERNAME: oauth2accesstoken
          UV_INDEX_CO_PYPI_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: uv sync --locked --group dev

      - name: pytest
        run: uv run pytest
