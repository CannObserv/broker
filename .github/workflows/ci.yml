name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: lint + test
    # The node's image, not ubuntu-latest (#88): tests/deploy/test_workflow_pins.py.
    runs-on: ubuntu-24.04
    # WIF: mint an OIDC token for google-github-actions/auth to impersonate the
    # read-only co-pypi-reader SA and pull the cannobserv wheelhouse. Same
    # arrangement as CannObserv/archiver (archiver#72, #75); the provider's
    # attribute condition has to admit this repository.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # SHA-pinned: setup-uv publishes no floating major tag since v8 (#88).
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          # Not the default since v9. Unpruned, the saved cache holds co-core
          # unpacked from the private wheelhouse, in a public repo's cache.
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Authenticate to Google Cloud (WIF, read-only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com

      - name: Sync cannobserv wheelhouse
        run: uv run --frozen --only-group wheelhouse python scripts/sync_wheelhouse.py

      - name: uv sync
        run: uv sync --group dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: shellcheck
        # A step, not a job: scripts/deploy.sh's CI_JOBS gate covers it as is (#112).
        run: bash scripts/shellcheck.sh

      - name: pytest
        run: uv run pytest
