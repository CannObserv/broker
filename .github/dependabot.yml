# Moves the action pins nothing else moves (#90): ci.yml and audit.yml pin
# every `uses:` to a commit SHA with a `# vX.Y.Z` comment (#88), and setup-uv
# publishes no floating major to follow. Each PR is gated by ci.yml; a
# Dependabot run reads its own credential context, so the WIF step is the
# first thing to read on a red one. How one lands, fast-forwarded onto main
# locally: docs/CI.md.
#
# github-actions only. `uv` is out for #86's reason: co-core resolves from the
# private wheelhouse, which Dependabot's updater cannot sync.
# Guarded by tests/deploy/test_dependabot.py: a mistyped config stops producing
# PRs without erroring anywhere a person looks.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # scans .github/workflows/
    # Generated by install-cadence.sh; a re-render reverts any bump made in it
    # (gregoryfoster/skills#373). Its pin moves with the installer.
    exclude-paths:
      - ".github/workflows/context-cadence.yml"
    schedule:
      interval: "weekly"
    # The default is 5, and past it Dependabot opens nothing and says so
    # nowhere. One PR per action; the test derives the bound.
    open-pull-requests-limit: 10
    # The PR's commit lands on main as-is: "chore: bump actions/checkout ...".
    commit-message:
      prefix: "chore"
