[project]
name = "broker"
version = "0.1.0"
description = "Operational code for the Cannabis Observer change-bus broker: Redis tuning, the bus-health probe, and the cluster stream inventory."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Floor 0.37.1 is content.capture (cannobserv#571), registered here by
    # CannObserv/broker#114. tests/canonical.py reads every topic constant, so a
    # release adding a stream turns the inventory and ACL tests red until it has
    # a row, a group and a grant: such a bump is a registration, never a ride-along.
    # From the co-pypi index alone ([tool.uv.sources], below); uv.lock holds each
    # file's sha256 (#144).
    "co-core>=0.37.1,<0.38",
    "google-cloud-storage>=2,<4",
    "python-json-logger>=4.0.0,<5",
    "redis[hiredis]>=5",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    "fakeredis>=2.20",
    # 9.1.0 and 9.1.1 lose a directory's conftest fixtures when the command line
    # interleaves it with a sibling (pytest-dev/pytest#14635, CannObserv/broker#73).
    # 9.2.0 is the first release with the fix (9.1.2 never shipped), so it is the
    # floor (#83). tests/deploy/test_pytest_collection.py is what says a later
    # pytest still carries it.
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.3.0,<2",
]
# The gate's tools. .githooks/pre-commit and scripts/shellcheck.sh run them as
# `uv run --frozen --only-group lint`: no project, so no co-pypi token (#112, #144).
# shellcheck-py's wheel carries the shellcheck binary, so the lock hash-pins it:
# no root install on the node, one version everywhere. A bump moves the gate:
# `uv lock --upgrade-package shellcheck-py`, then fix what it finds and the
# version docs/CI.md names, which tests/deploy/test_shellcheck_gate.py holds.
lint = ["ruff>=0.16.8,<0.17", "shellcheck-py>=0.11.0.1,<0.12"]
# scripts/co_pypi_token.py's own dep, locked (#113's rule, #144): scripts/co-pypi.sh
# runs it `--frozen --only-group co-pypi`, before any co-core file is fetched, so
# nothing in the process that holds the key is resolved at run time.
co-pypi = ["google-auth[requests]>=2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -p pytester"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "error::DeprecationWarning",
]
# A passing session keeps no tmp_path; one with a failure keeps the failed
# tests' and its session-scoped dirs (#126). The default kept every test's for
# three sessions, about 600 MB on a node whose root is Redis's AOF headroom. The deploy tests' 555 releases outlast the per-test cleanup, which
# cannot enter them, and go with the rotation. One session's, so the disk GC's
# alert line is the baseline plus one run's (#127). tests/deploy/test_pytest_tmp_retention.py.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
line-length = 100
target-version = "py312"
# The vendored skills are upstream's code under upstream's rules. The daily
# refresh hook moves them without review, so linting them here would let an
# upstream commit fail this repo's gate - locally only, as CI never checks the
# submodule out. See docs/SKILLS.md.
extend-exclude = ["skills-vendor/"]
# The docs are formatted too (#38). ruff 0.16's default `include` takes `*.md`,
# and `ruff format` rewrites the `python` / `py` fences in a doc; the docs carry
# only `bash` fences today, so the bump reformatted nothing. gregoryfoster/skills
# excludes `*.md` because its docs quote other repos' source verbatim. A doc here
# that quotes another repo's Python puts it under another tag (`text`) or between
# `<!-- fmt: off -->` and `<!-- fmt: on -->`, so the quotation still says what
# the quoted file says. tests/deploy/test_ruff_config.py pins the inclusion and
# the tag escape.

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# PLC0415 enforces the cohort's "no inline module imports" convention.
extend-select = ["B904", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# A floor a re-lock keeps (CannObserv/broker#124): certifi is transitive, through
# requests, and its bundle is the GCS clients' whole TLS trust. 2026.10.19 drops
# emSign ECC Root CA - G3, the eMudhra-compromised chains' root
# (https://exe.dev/security/emudhra-compromise). tests/test_tls_trust.py.
constraint-dependencies = ["certifi>=2026.10.19"]

# co-core comes from cannobserv's co-pypi Artifact Registry index, and only it
# does (#144; cannobserv RELEASING.md, Path C). `explicit`: uv asks the index only
# for the names [tool.uv.sources] pins to it, so co-core never comes from PyPI,
# where the name is unclaimed (cannobserv#615), and nothing else comes from here.
# A source binds to a direct dependency alone: a cannobserv package broker only
# got transitively would need its own line. The URL is the org registry's byte
# for byte, trailing slash included, so Dependabot's updater authenticates it
# over OIDC (cannobserv docs/DEPENDABOT.md).
#
# uv.lock records each file's sha256 as the index serves it, and `uv sync
# --locked` refuses a download that misses it: that replaced #125's hand-kept
# [tool.broker.wheelhouse-sha256]. #125's limit, restated: a digest is what the
# index served at lock time, so it stops a later swap, local or in transit, not
# one made before the lock; cannobserv's publish run reads each uploaded file
# back from the index under its local sha256 (cannobserv#554). 0.37.1's digests
# on the index equalled #125's table, read 2026-11-12.
#
# Every `uv lock`, and a `uv sync` that downloads, needs the reader's token:
# `bash scripts/co-pypi.sh uv ...` (docs/CI.md, The co-pypi index).
# tests/deploy/test_dependency_index.py.
[[tool.uv.index]]
name = "co-pypi"
url = "https://us-west1-python.pkg.dev/co-gcs/co-pypi/simple/"
explicit = true

[tool.uv.sources]
co-core = { index = "co-pypi" }
