[project]
name = "broker"
version = "0.1.0"
description = "Operational code for the Cannabis Observer change-bus broker: Redis tuning, the bus-health probe, and the cluster stream inventory."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Floor 0.37.1 is content.capture (cannobserv#571), registered here by
    # CannObserv/broker#114. tests/canonical.py reads every topic constant, so a
    # release adding a stream turns the inventory and ACL tests red until it has
    # a row, a group and a grant: such a bump is a registration, never a ride-along.
    # The locked files' digests move with it: [tool.broker.wheelhouse-sha256].
    "co-core>=0.37.1,<0.38",
    "google-cloud-storage>=2,<4",
    "python-json-logger>=4.0.0,<5",
    "redis[hiredis]>=5",
]

# The sha256 of each wheelhouse file uv.lock names (CannObserv/broker#125). uv
# records none for a find-links path, and a hand-added one is gone at the next
# `uv lock`. scripts/sync_wheelhouse.py fetches a file that misses its digest
# again and refuses a download that misses it too; scripts/deploy.sh refuses a
# release whose copy misses it, before `uv sync`. A pin change moves these in the
# same diff: sync, `uv lock`, then `sha256sum .wheelhouse/<file>` for each new
# name, from a download checked against a second source where there is one.
# Each digest is of a file fetched over GCS's TLS, so it stops a later swap,
# local or in transit, not one made at pin time. One "file" = "hex" line each,
# the form deploy.sh's awk reads: tests/deploy/test_sync_wheelhouse.py holds it,
# and the table to the lock. 0.37.1's: fetched 2026-10-19 and again 2026-10-24,
# one object generation, GCS's md5Hash and crc32c matching both times.
[tool.broker.wheelhouse-sha256]
"co_core-0.37.1-py3-none-any.whl" = "7a8b4c0c3f8fa00cf7f9c5e7b2b86e89d847118b6024c303c7efe5063db9aae5"
"co_core-0.37.1.tar.gz" = "df068bc7b2226295f8087a65bed7c5f586c605581462e073c1080ce90ad2543b"

[dependency-groups]
dev = [
    { include-group = "lint" },
    "fakeredis>=2.20",
    # 9.1.0 and 9.1.1 lose a directory's conftest fixtures when the command line
    # interleaves it with a sibling (pytest-dev/pytest#14635, CannObserv/broker#73).
    # The fix is on 9.1.x, unreleased as of 2026-10-06: once 9.1.2 ships,
    # `uv lock --upgrade-package pytest` takes it with no edit here, and
    # tests/deploy/test_pytest_collection.py is what says whether it carries the fix.
    "pytest>=9.0.3,!=9.1.0,!=9.1.1,<10",
    "pytest-asyncio>=1.3.0,<2",
]
# The gate's tools. .githooks/pre-commit and scripts/shellcheck.sh run them as
# `uv run --frozen --only-group lint`: no project, so no wheelhouse (#112).
# shellcheck-py's wheel carries the shellcheck binary, so the lock hash-pins it:
# no root install on the node, one version everywhere. A bump moves the gate:
# `uv lock --upgrade-package shellcheck-py`, then fix what it finds and the
# version docs/CI.md names, which tests/deploy/test_shellcheck_gate.py holds.
lint = ["ruff>=0.16.8,<0.17", "shellcheck-py>=0.11.0.1,<0.12"]
# scripts/sync_wheelhouse.py's own deps, locked: `uv run --frozen --only-group
# wheelhouse` installs them without the project, whose co-core is what the sync
# fetches (CannObserv/broker#113). One package, the project's own pin.
wheelhouse = ["google-cloud-storage>=2,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -p pytester"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "error::DeprecationWarning",
]
# A passing session keeps no tmp_path; one with a failure keeps the failed
# tests' and its session-scoped dirs (#126). The default kept every test's for
# three sessions, about 600 MB on a node whose root is Redis's AOF headroom. The deploy tests' 555 releases outlast the per-test cleanup, which
# cannot enter them, and go with the rotation. One session's, so the disk GC's
# alert line is the baseline plus one run's (#127). tests/deploy/test_pytest_tmp_retention.py.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
line-length = 100
target-version = "py312"
# The vendored skills are upstream's code under upstream's rules. The daily
# refresh hook moves them without review, so linting them here would let an
# upstream commit fail this repo's gate - locally only, as CI never checks the
# submodule out. See docs/SKILLS.md.
extend-exclude = ["skills-vendor/"]
# The docs are formatted too (#38). ruff 0.16's default `include` takes `*.md`,
# and `ruff format` rewrites the `python` / `py` fences in a doc; the docs carry
# only `bash` fences today, so the bump reformatted nothing. gregoryfoster/skills
# excludes `*.md` because its docs quote other repos' source verbatim. A doc here
# that quotes another repo's Python puts it under another tag (`text`) or between
# `<!-- fmt: off -->` and `<!-- fmt: on -->`, so the quotation still says what
# the quoted file says. tests/deploy/test_ruff_config.py pins the inclusion and
# the tag escape.

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# PLC0415 enforces the cohort's "no inline module imports" convention.
extend-select = ["B904", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# co-core resolves from the local wheelhouse, mirrored from the private GCS
# index gs://co-gcs-pypi by scripts/sync_wheelhouse.py before `uv sync`/`uv run`
# (the pattern is CannObserv/archiver#72, #75). No git sources for cannobserv:
# reproducibility is uv.lock's pinned version plus the named wheelhouse
# artifact. find-links locks by filename, not hash: the content check is
# [tool.broker.wheelhouse-sha256], above (#125).
find-links = ["./.wheelhouse"]
# A floor a re-lock keeps (CannObserv/broker#124): certifi is transitive, through
# requests, and its bundle is the GCS clients' whole TLS trust. 2026.10.19 drops
# emSign ECC Root CA - G3, the eMudhra-compromised chains' root
# (https://exe.dev/security/emudhra-compromise). tests/test_tls_trust.py.
constraint-dependencies = ["certifi>=2026.10.19"]
