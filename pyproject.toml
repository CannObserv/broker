[project]
name = "broker"
version = "0.1.0"
description = "Operational code for the Cannabis Observer change-bus broker: Redis tuning, the bus-health probe, and the cluster stream inventory."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "co-core>=0.13.1,<0.14",
    "python-json-logger>=4.0.0,<5",
    "redis[hiredis]>=5",
]

[dependency-groups]
dev = [
    "fakeredis>=2.20",
    "pytest>=8.0,<9",
    "pytest-asyncio>=1.3.0,<2",
    "ruff>=0.15.0,<0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# PLC0415 enforces the cohort's "no inline module imports" convention.
extend-select = ["B904", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# co-core resolves from the local wheelhouse, mirrored from the private GCS
# index gs://co-gcs-pypi by scripts/sync_wheelhouse.py before `uv sync`/`uv run`
# (the pattern is CannObserv/archiver#72, #75). No git sources for cannobserv:
# reproducibility is uv.lock's pinned version plus the named wheelhouse
# artifact (find-links locks by filename, not hash; content integrity rests on
# the GCS bucket's immutability and access control).
find-links = ["./.wheelhouse"]
